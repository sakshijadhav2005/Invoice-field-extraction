<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruviti Invoice Field Extractor</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
        }

        .container {
            max-width: 1050px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 0.75rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.4);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-primary);
            background: var(--accent-glow);
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            stroke: var(--accent-primary);
            margin-bottom: 0.75rem;
        }

        .drop-zone-text {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .drop-zone-sub {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        #file-input {
            display: none;
        }

        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            gap: 1rem;
        }

        .file-info {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.75rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field-name {
            font-weight: 600;
            color: #cbd5e1;
        }

        .field-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #e2e8f0;
            word-break: break-all;
        }

        .conf-cell {
            width: 140px;
        }

        .conf-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .conf-bar-bg {
            flex: 1;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }

        .conf-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .conf-label {
            font-size: 0.8rem;
            font-family: monospace;
            width: 36px;
            text-align: right;
        }

        .json-viewer {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            max-height: 420px;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            white-space: pre-wrap;
        }

        .warnings-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1rem;
        }

        .warnings-box h4 {
            color: var(--accent-warning);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .warnings-box ul {
            padding-left: 1.25rem;
            color: #fbbf24;
            font-size: 0.875rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-ready { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-loading { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Invoice Field Extractor</h1>
            <p>Fast, offline-first invoice information extraction engine</p>
        </header>

        <div class="card">
            <div class="drop-zone" id="drop-zone">
                <svg fill="none" stroke-width="1.7" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                </svg>
                <div class="drop-zone-text">Click to choose or drag & drop an invoice PDF</div>
                <div class="drop-zone-sub">PDF files with text layer (scanned/OCR out of scope)</div>
                <input type="file" id="file-input" accept="application/pdf" />
            </div>

            <div class="action-bar">
                <div class="file-info" id="file-info">No file selected</div>
                <button class="btn" id="extract-btn" disabled>
                    <span id="btn-text">Extract Fields</span>
                </button>
            </div>
        </div>

        <div class="grid-2" id="results-area" style="display: none;">
            <div class="card">
                <div class="section-title">
                    <span>Extracted Fields</span>
                    <span id="status-badge" class="status-badge badge-ready">Done</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Field</th>
                            <th>Value</th>
                            <th class="conf-cell">Confidence</th>
                        </tr>
                    </thead>
                    <tbody id="fields-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>

                <div id="warnings-container" style="display: none;" class="warnings-box">
                    <h4>Warnings & Flags</h4>
                    <ul id="warnings-list"></ul>
                </div>
            </div>

            <div class="card">
                <div class="section-title">
                    <span>API Response JSON</span>
                    <button class="btn" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;" id="copy-json-btn">Copy</button>
                </div>
                <div class="json-viewer" id="json-viewer">{}</div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const extractBtn = document.getElementById('extract-btn');
        const btnText = document.getElementById('btn-text');
        const resultsArea = document.getElementById('results-area');
        const fieldsTableBody = document.getElementById('fields-table-body');
        const warningsContainer = document.getElementById('warnings-container');
        const warningsList = document.getElementById('warnings-list');
        const jsonViewer = document.getElementById('json-viewer');
        const statusBadge = document.getElementById('status-badge');
        const copyJsonBtn = document.getElementById('copy-json-btn');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                alert('Please upload a valid PDF document.');
                return;
            }
            selectedFile = file;
            fileInfo.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            extractBtn.disabled = false;
        }

        extractBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            extractBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Extracting...';
            statusBadge.className = 'status-badge badge-loading';
            statusBadge.textContent = 'Processing...';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/extract', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ detail: 'Extraction failed' }));
                    throw new Error(err.detail || `Server returned ${response.status}`);
                }

                const data = await response.json();
                renderResults(data);
                statusBadge.className = 'status-badge badge-ready';
                statusBadge.textContent = 'Extracted';
            } catch (err) {
                alert('Error extracting fields: ' + err.message);
                statusBadge.className = 'status-badge badge-error';
                statusBadge.textContent = 'Error';
            } finally {
                extractBtn.disabled = false;
                btnText.textContent = 'Extract Fields';
            }
        });

        function renderResults(data) {
            resultsArea.style.display = 'grid';
            jsonViewer.textContent = JSON.stringify(data, null, 2);

            const fields = [
                { key: 'vendor', label: 'Vendor' },
                { key: 'invoice_number', label: 'Invoice No' },
                { key: 'invoice_date', label: 'Invoice Date' },
                { key: 'due_date', label: 'Due Date' },
                { key: 'currency', label: 'Currency' },
                { key: 'subtotal', label: 'Subtotal' },
                { key: 'tax', label: 'Tax' },
                { key: 'total', label: 'Total' }
            ];

            fieldsTableBody.innerHTML = '';
            fields.forEach(f => {
                const val = data[f.key] !== null && data[f.key] !== undefined ? data[f.key] : '—';
                const conf = (data.confidence && data.confidence[f.key] !== undefined) ? data.confidence[f.key] : 0;
                const confPercent = Math.round(conf * 100);

                let barColor = '#10b981';
                if (conf < 0.6) barColor = '#ef4444';
                else if (conf < 0.85) barColor = '#f59e0b';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="field-name">${f.label}</td>
                    <td class="field-val">${val}</td>
                    <td class="conf-cell">
                        <div class="conf-wrapper">
                            <div class="conf-bar-bg">
                                <div class="conf-bar-fill" style="width: ${confPercent}%; background-color: ${barColor};"></div>
                            </div>
                            <span class="conf-label">${confPercent}%</span>
                        </div>
                    </td>
                `;
                fieldsTableBody.appendChild(tr);
            });

            if (data.warnings && data.warnings.length > 0) {
                warningsContainer.style.display = 'block';
                warningsList.innerHTML = data.warnings.map(w => `<li>${w}</li>`).join('');
            } else {
                warningsContainer.style.display = 'none';
            }
        }

        copyJsonBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(jsonViewer.textContent);
            copyJsonBtn.textContent = 'Copied!';
            setTimeout(() => { copyJsonBtn.textContent = 'Copy'; }, 1500);
        });
    </script>
</body>
</html>
